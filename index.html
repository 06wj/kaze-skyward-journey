<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f2e6" />
    <meta
      name="description"
      content="风见之羽，一段穿越日式都市与晴空的飞行旅程。化身燕子，沿着风，飞过这座城市。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>风见之羽 · KAZE — A Skyward Journey</title>
    <style>
      html,
      body {
        margin: 0;
        background: #c5dfe0;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        font-family: serif;
        color: #23434a;
        background: #f5f2e8;
        z-index: 1000;
        transition: opacity 0.5s;
      }
      #boot small {
        text-align: center;
        letter-spacing: 0.3em;
        font: 10px sans-serif;
        margin-top: 15px;
      }
      #boot h1 {
        font-weight: 400;
        letter-spacing: 0.3em;
        margin: 0;
        font-size: 32px;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="boot">
      <h1>风见之羽</h1>
      <small>THE SKY IS CALLING</small>
    </div>
    <noscript>请启用 JavaScript 来开启飞行旅程。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
